[package]
name = "wristkey-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "wristkey_daemon"
path = "src/lib.rs"

[[bin]]
name = "wristkeyd"
path = "src/main.rs"

[[bin]]
name = "wristkey-pair"
path = "src/pair_gui.rs"

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:winit"]

[dependencies]
wristkey-core = { path = "../core" }
wristkey-ble = { path = "../ble" }
wristkey-platform-win = { path = "../platform-win" }
wristkey-platform-linux = { path = "../platform-linux" }
wristkey-platform-macos = { path = "../platform-macos" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing-appender = { workspace = true }
directories = "5"
futures = "0.3"
btleplug = "0.11"

tray-icon = { version = "0.19", optional = true }
winit = { version = "0.30", optional = true }
eframe = "0.28"
hex = "0.4"
