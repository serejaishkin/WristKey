[package]
name = "wristkey-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "wristkey_daemon"
path = "src/lib.rs"

[[bin]]
name = "wristkeyd"
path = "src/main.rs"

[dependencies]
wristkey-core = { path = "../core" }
wristkey-ble = { path = "../ble" }
wristkey-platform-linux = { path = "../platform-linux" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing-appender = { workspace = true }
directories = "5"
