name: Credential Provider Build

on:
  push:
    paths:
      - 'WristKeyCredentialProvider.cs'
      - 'WristKeyCredentialProvider.csproj'
      - 'install-wristkey-provider.ps1'
      - '.github/workflows/credential-provider.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 provider
        shell: pwsh
        run: dotnet build WristKeyCredentialProvider.csproj -c Release --no-restore
      - name: Prepare provider artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact\bin | Out-Null
          Copy-Item bin\Release\net48\WristKeyCredentialProvider.dll artifact\bin\WristKeyCredentialProvider.dll
          Copy-Item install-wristkey-provider.ps1 artifact\install-wristkey-provider.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wristkey-credential-provider-x64
          path: artifact
