name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - run: cd desktop && cargo check --workspace
      - run: cd desktop && cargo clippy --workspace -- -D warnings
      - run: cd desktop && cargo test --workspace

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Check Windows crate (cross)
        run: cd desktop && cargo check --target x86_64-pc-windows-msvc -p wristkey-platform-win
      - name: Check core (cross)
        run: cd desktop && cargo check --target x86_64-pc-windows-msvc -p wristkey-core

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop && cargo install cargo-audit cargo-deny
      - run: cd desktop && cargo audit
      - run: cd desktop && cargo deny check
